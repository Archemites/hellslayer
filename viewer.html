<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nivaldo 3D</title>
<style>
  @font-face { font-family: 'Cinzel'; src: url('fonts/Cinzel-Bold.otf'); }
  @font-face { font-family: 'Garamond'; src: url('fonts/EBGaramond-Variable.ttf'); }
  :root { --ink: #e8d8c0; --dim: #9c8670; --gold: #d4a017; --panel: rgba(16, 8, 6, 0.82); --line: #4a2a1c; }
  html, body { margin: 0; height: 100%; background: #0b0605; color: var(--ink); overflow: hidden; }
  body { font-family: 'Garamond', Georgia, serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  body.psx canvas { image-rendering: pixelated; }
  #ui {
    position: fixed; left: 16px; top: 16px; width: 250px; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    font-size: 15px; user-select: none;
  }
  h1 { font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 2px; margin: 0 0 2px; color: var(--gold); }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  .lbl { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 1.5px; color: var(--dim); margin: 12px 0 6px; text-transform: uppercase; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: inherit; font-size: 14px; color: var(--ink); background: #2a1610; border: 1px solid var(--line);
    padding: 4px 9px; border-radius: 3px; cursor: pointer;
  }
  button:hover { border-color: var(--gold); }
  button.on { background: #6a1a10; border-color: var(--gold); }
  label { display: flex; align-items: center; gap: 6px; margin: 3px 0; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: #a02010; }
  #hint { position: fixed; right: 16px; bottom: 14px; color: var(--dim); font-size: 13px; }
  @media (max-width: 600px) { #ui { width: auto; right: 16px; } }
</style>
</head>
<body class="psx">
<canvas id="c"></canvas>
<div id="ui">
  <h1>NIVALDO CRUZ</h1>
  <div class="sub">Modelo 3D · arte de referência</div>

  <div class="lbl">Pose</div>
  <div class="row" id="poses">
    <button data-p="tpose" class="on">T-pose</button>
    <button data-p="idle">Parado</button>
    <button data-p="walk">Andando</button>
    <button data-p="flex">Bíceps</button>
    <button data-p="punch">Soco</button>
  </div>

  <div class="lbl">Sangue</div>
  <input type="range" id="blood" min="0" max="1" step="0.25" value="0.75">

  <div class="lbl">Props</div>
  <label><input type="checkbox" id="pHammer"> Martelo de obras</label>
  <label><input type="checkbox" id="pRosary"> Rosário no pulso</label>
  <label><input type="checkbox" id="pHeart"> Coração Ateu</label>

  <div class="lbl">Visual</div>
  <label><input type="checkbox" id="psx" checked> Resolução PS1 (480p)</label>
  <label><input type="checkbox" id="spin"> Girar sozinho</label>
  <label><input type="checkbox" id="cmp"> Comparar com o modelo antigo</label>
</div>
<div id="hint">arraste para girar · roda do mouse para zoom · botão direito para mover</div>

<script src="vendor/three.min.js"></script>
<script src="js/textures.js"></script>
<script src="js/models.js"></script>
<script src="js/nivaldo.js"></script>
<script>
'use strict';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setClearColor(0x0b0605);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b0605, 14, 30);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);

// Iluminação no mesmo espírito do jogo (ambiente quente + "sol" infernal + luz de tocha)
scene.add(new THREE.AmbientLight(0x8a5a50, 1.0));
const sun = new THREE.DirectionalLight(0xffb48a, 0.75); sun.position.set(-1.5, 3, 2.5); scene.add(sun);
const rim = new THREE.DirectionalLight(0xff3a1a, 0.55); rim.position.set(2, 1.5, -3); scene.add(rim);
const torch = new THREE.PointLight(0xffc080, 0.6, 12, 1.2); torch.position.set(1.8, 2.6, 2.4); scene.add(torch);

const floor = new THREE.Mesh(new THREE.CircleGeometry(3.2, 24), TX.mat('stone'));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
if (floor.material.map) floor.material.map.repeat.set(4, 4);

let nv = null, old = null;
function rebuild() {
  if (nv) scene.remove(nv.root);
  nv = buildNivaldoRef({ blood: +document.getElementById('blood').value });
  scene.add(nv.root);
  layout();
  applyProps();
}
function layout() {
  const cmp = document.getElementById('cmp').checked;
  if (cmp && !old) { old = BUILD.nivaldoClassic(); scene.add(old.root); }
  if (old) old.root.visible = cmp;
  nv.root.position.x = cmp ? -1.6 : 0;
  if (old) old.root.position.x = 1.6;
}
function applyProps() {
  for (const r of [nv, old]) {
    if (!r) continue;
    r.hammer.visible = document.getElementById('pHammer').checked;
    r.rosary.root.visible = document.getElementById('pRosary').checked;
    r.heart.visible = document.getElementById('pHeart').checked;
  }
}

/* ---------- poses (mesmas juntas que o game2.js anima) ---------- */
let pose = 'tpose';
function resetPose(N) {
  N.torsoGroup.position.set(0, 0.98, 0);
  N.torsoGroup.rotation.set(0, 0, 0);
  N.chestGroup.rotation.set(0, 0, 0);
  N.head.rotation.set(0, 0, 0);
  for (const k of ['shoulderL', 'shoulderR', 'armL', 'armR', 'handL', 'handR', 'legL', 'legR', 'kneeL', 'kneeR', 'footL', 'footR']) N[k].rotation.set(0, 0, 0);
  N.forearmL.rotation.set(-0.22, 0, 0);
  N.forearmR.rotation.set(-0.22, 0, 0);
}
function animate(N, t) {
  resetPose(N);
  if (pose === 'tpose') {
    N.armL.rotation.z = -Math.PI / 2; N.armR.rotation.z = Math.PI / 2;
    N.forearmL.rotation.x = 0; N.forearmR.rotation.x = 0;
    N.legL.rotation.z = -0.06; N.legR.rotation.z = 0.06;
  } else if (pose === 'idle') {
    const b = Math.sin(t * 1.6);
    N.chestGroup.rotation.x = -0.02 * b;
    N.torsoGroup.position.y = 0.98 + 0.006 * b;
    N.armL.rotation.z = -0.16 - 0.02 * b; N.armR.rotation.z = 0.16 + 0.02 * b;
    N.head.rotation.y = Math.sin(t * 0.4) * 0.15;
  } else if (pose === 'walk') {
    const p = t * 5.5, st = Math.sin(p);
    N.legL.rotation.x = st * 0.55; N.legR.rotation.x = -st * 0.55;
    N.kneeL.rotation.x = Math.max(0, -Math.cos(p)) * 0.8;
    N.kneeR.rotation.x = Math.max(0, Math.cos(p)) * 0.8;
    N.armL.rotation.x = -st * 0.45; N.armR.rotation.x = st * 0.45;
    N.armL.rotation.z = -0.14; N.armR.rotation.z = 0.14;
    N.forearmL.rotation.x = -0.45; N.forearmR.rotation.x = -0.45;
    N.torsoGroup.rotation.y = st * 0.08;
    N.torsoGroup.position.y = 0.98 + Math.abs(Math.cos(p)) * 0.03;
  } else if (pose === 'flex') {
    const b = Math.sin(t * 2.2) * 0.04;
    N.armL.rotation.z = -Math.PI / 2 + 0.1; N.armR.rotation.z = Math.PI / 2 - 0.1;
    N.forearmL.rotation.set(0, 0, -Math.PI / 2 - 0.35 - b);
    N.forearmR.rotation.set(0, 0, Math.PI / 2 + 0.35 + b);
    N.chestGroup.rotation.x = -0.06;
    N.legL.rotation.z = -0.12; N.legR.rotation.z = 0.12;
  } else if (pose === 'punch') {
    const c = (t * 1.4) % 1, k = c < 0.25 ? c / 0.25 : c < 0.5 ? 1 : Math.max(0, 1 - (c - 0.5) / 0.4);
    N.armL.rotation.set(-1.1, 0, -0.2); N.forearmL.rotation.x = -1.6;
    N.armR.rotation.set(-0.9 - 0.7 * k, 0, 0.2 - 0.25 * k); N.forearmR.rotation.x = -1.7 + 1.55 * k;
    N.torsoGroup.rotation.y = -0.35 * k; N.chestGroup.rotation.y = -0.15 * k;
    N.legL.rotation.x = -0.3; N.kneeL.rotation.x = 0.3; N.legR.rotation.x = 0.25;
  }
}

/* ---------- câmera orbital ---------- */
const orbit = { yaw: 0.35, pitch: 0.12, dist: 7.6, target: new THREE.Vector3(0, 1.75, 0) };
let drag = null;
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, b: e.button }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.b === 2) {
    orbit.target.y = THREE.MathUtils.clamp(orbit.target.y + dy * 0.006, 0.2, 3.6);
  } else {
    orbit.yaw -= dx * 0.008;
    orbit.pitch = THREE.MathUtils.clamp(orbit.pitch + dy * 0.006, -0.4, 1.2);
  }
});
canvas.addEventListener('wheel', (e) => { e.preventDefault(); orbit.dist = THREE.MathUtils.clamp(orbit.dist * (1 + Math.sign(e.deltaY) * 0.1), 1.6, 16); }, { passive: false });

/* ---------- UI ---------- */
document.getElementById('poses').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  pose = b.dataset.p;
  for (const x of document.querySelectorAll('#poses button')) x.classList.toggle('on', x === b);
});
document.getElementById('blood').addEventListener('input', rebuild);
for (const id of ['pHammer', 'pRosary', 'pHeart']) document.getElementById(id).addEventListener('change', applyProps);
document.getElementById('cmp').addEventListener('change', () => { layout(); applyProps(); orbit.dist = document.getElementById('cmp').checked ? 11 : 7.6; });
document.getElementById('psx').addEventListener('change', resize);

function resize() {
  const w = innerWidth, h = innerHeight, psxOn = document.getElementById('psx').checked;
  document.body.classList.toggle('psx', psxOn);
  const f = psxOn ? Math.min(1, 480 / Math.min(w, h * 16 / 9)) : 1;
  const rw = Math.max(1, Math.round(w * f)), rh = Math.max(1, Math.round(h * f));
  renderer.setPixelRatio(psxOn ? 1 : Math.min(2, devicePixelRatio));
  renderer.setSize(rw, rh, false);
  PSX_RES.value.set(psxOn ? rw : rw * 4, psxOn ? rh : rh * 4);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

rebuild();
resize();
const clock = new THREE.Clock();
let t = 0;
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, clock.getDelta());
  t += dt;
  if (document.getElementById('spin').checked && !drag) orbit.yaw += dt * 0.4;
  animate(nv, t);
  if (old && old.root.visible) animate(old, t);
  const cp = Math.cos(orbit.pitch);
  camera.position.set(
    orbit.target.x + Math.sin(orbit.yaw) * cp * orbit.dist,
    orbit.target.y + Math.sin(orbit.pitch) * orbit.dist,
    orbit.target.z + Math.cos(orbit.yaw) * cp * orbit.dist
  );
  camera.lookAt(orbit.target);
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
